server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Отсутствующие ресурсы не должны получать HTML через SPA fallback.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|json|webmanifest|png|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
